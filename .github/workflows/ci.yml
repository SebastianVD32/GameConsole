name: CI/CD GameConsole

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gamestats_ref:
        description: "Rama, tag o commit de GameStats para la integración"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum revision supporting RACING MATCH_ABORTED in both Go and Scala.
  GAMESTATS_REF: ${{ inputs.gamestats_ref || vars.GAMESTATS_REF || '6243151d7c82919720742056f15a22f2d372482e' }}

jobs:
  tests:
    name: Pruebas (Python + SWI-Prolog en Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Compilar y ejecutar pruebas
        run: docker build --target test --progress plain -t gameconsole:test .

      - name: Configurar Node para las reglas de los juegos
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Probar reglas de Pac-Man, carreras y entrega de eventos
        run: node --test tests/pacman.test.cjs tests/racing.test.cjs tests/delivery.test.cjs

  integration:
    name: Ejecución integrada con GameStats
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar GameConsole
        uses: actions/checkout@v7

      - name: Descargar GameStats (${{ env.GAMESTATS_REF }})
        uses: actions/checkout@v7
        with:
          repository: SebastianVD32/GameStats
          ref: ${{ env.GAMESTATS_REF }}
          path: GameStats

      - name: Construir y levantar consola, Prolog, Go y Scala
        env:
          GAMESTATS_DIR: ./GameStats
        run: docker compose up --build --wait --wait-timeout 300 -d

      - name: Prueba de humo (partidas concurrentes contra la IA y estadísticas)
        run: python3 scripts/smoke_test.py http://127.0.0.1:5000 --matches 4 --moves 6

      - name: Configurar Node para la integración arcade
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verificar carreras concurrentes y regresión de Pac-Man con Go y Scala
        env:
          VERIFY_SCALA: "1"
        run: node tests/racing.integration.cjs

      - name: Registros de los servicios
        if: failure()
        env:
          GAMESTATS_DIR: ./GameStats
        run: docker compose logs --no-color

      - name: Detener servicios
        if: always()
        env:
          GAMESTATS_DIR: ./GameStats
        run: docker compose down --volumes

  publish:
    name: Verificar y publicar las tres imágenes en GHCR
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Descargar la misma revisión de GameStats verificada
        uses: actions/checkout@v7
        with:
          repository: SebastianVD32/GameStats
          ref: ${{ env.GAMESTATS_REF }}
          path: GameStats

      - name: Configurar Node para verificar las imágenes
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir las tres imágenes de la entrega
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "IMAGE_OWNER=${OWNER,,}" >> "$GITHUB_ENV"
          echo "GAMECONSOLE_TAG=sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          prefix="ghcr.io/${OWNER,,}"
          docker build --target runtime --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$prefix/gameconsole:sha-$GITHUB_SHA" .
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GAMESTATS_REF" -t "$prefix/gameconsole-gamestats-go:sha-$GITHUB_SHA" GameStats/go-ingestion
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GAMESTATS_REF" -t "$prefix/gameconsole-gamestats-scala:sha-$GITHUB_SHA" GameStats/scala-analytics

      - name: Probar la entrega sin código fuente
        env:
          VERIFY_SCALA: "1"
        run: |
          docker compose -f deploy/compose.yaml -f deploy/verify.compose.yaml up --pull never --wait --wait-timeout 180 -d
          python3 scripts/smoke_test.py http://127.0.0.1:5000 --matches 4 --moves 6
          node tests/racing.integration.cjs
          node tests/gamestats.integration.cjs

      - name: Publicar versiones verificadas y luego actualizar latest
        run: |
          for image in gameconsole gameconsole-gamestats-go gameconsole-gamestats-scala; do
            docker push "ghcr.io/$IMAGE_OWNER/$image:$GAMECONSOLE_TAG"
          done
          for image in gameconsole gameconsole-gamestats-go gameconsole-gamestats-scala; do
            docker tag "ghcr.io/$IMAGE_OWNER/$image:$GAMECONSOLE_TAG" "ghcr.io/$IMAGE_OWNER/$image:latest"
            docker push "ghcr.io/$IMAGE_OWNER/$image:latest"
          done
          {
            echo "## Entrega verificada"
            echo "Versión conjunta: $GAMECONSOLE_TAG"
            echo 'Las tres imágenes se probaron juntas. Los paquetes conservan el acceso de GitHub; los jugadores solo necesitan el enlace del alojamiento.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar archivos para el servidor Azure
        run: |
          mkdir -p delivery
          cp -R deploy/. delivery/
          printf 'GAMECONSOLE_TAG=%s\nIMAGE_OWNER=%s\n' "$GAMECONSOLE_TAG" "$IMAGE_OWNER" > delivery/version.env

      - name: Preparar imágenes para Azure sin credenciales de registro
        run: |
          docker save -o delivery/images.tar "ghcr.io/$IMAGE_OWNER/gameconsole:$GAMECONSOLE_TAG" "ghcr.io/$IMAGE_OWNER/gameconsole-gamestats-go:$GAMECONSOLE_TAG" "ghcr.io/$IMAGE_OWNER/gameconsole-gamestats-scala:$GAMECONSOLE_TAG"

      - name: Guardar paquete de despliegue
        uses: actions/upload-artifact@v7
        with:
          name: gameconsole-deploy-${{ github.sha }}
          path: delivery/
          if-no-files-found: error

      - name: Registros del despliegue
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/verify.compose.yaml logs --no-color

      - name: Detener entorno de publicación
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/verify.compose.yaml down --volumes
