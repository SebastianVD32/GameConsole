# Despliegue sin código fuente: solo imágenes publicadas en GHCR.
#   docker compose -f deploy/compose.yaml up -d --wait
# Abre http://localhost:5000
#
# GAMECONSOLE_TAG: imagen publicada por el pipeline de GameConsole (latest o sha-xxxxxxx).
# GAMESTATS_VERSION: versión publicada de GameStats que incluye AI_DECISION,
#   /api/v1/summary (Go) y /api/v1/stats (Scala).
name: gameconsole-deploy

services:
  console:
    image: ghcr.io/sebastianvd32/gameconsole:${GAMECONSOLE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    environment:
      GAMESTATS_INGEST_URL: http://gamestats-go:8080
      GAMESTATS_ANALYTICS_URL: http://gamestats-scala:8081
    ports:
      - "${GAMECONSOLE_PORT:-5000}:5000"
    depends_on:
      gamestats-go:
        condition: service_healthy
      gamestats-scala:
        condition: service_healthy
    restart: unless-stopped

  gamestats-go:
    image: ghcr.io/sebastianvd32/gamestats-go:${GAMESTATS_VERSION:-v1.2.0}
    platform: linux/amd64
    pull_policy: always
    environment:
      HTTP_ADDR: ":8080"
      WORKER_COUNT: "4"
      ANALYZER_URL: http://gamestats-scala:8081/api/v1/matches
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      gamestats-scala:
        condition: service_healthy
    restart: unless-stopped

  gamestats-scala:
    image: ghcr.io/sebastianvd32/gamestats-scala:${GAMESTATS_VERSION:-v1.2.0}
    platform: linux/amd64
    pull_policy: always
    volumes:
      - results:/data/results
    restart: unless-stopped

volumes:
  results:
