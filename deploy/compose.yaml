# Despliegue sin código fuente: solo imágenes publicadas en GHCR.
#   docker compose -f deploy/compose.yaml up -d --wait
# Abre http://localhost:5000
#
# GAMECONSOLE_TAG: misma versión para los tres servicios (latest o sha-<commit completo>).
# El pipeline publica los tres componentes después de probar su integración.
name: gameconsole-deploy

services:
  console:
    image: ghcr.io/${IMAGE_OWNER:-sebastianvd32}/gameconsole:${GAMECONSOLE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    environment:
      GAMESTATS_INGEST_URL: http://gamestats-go:8080
      GAMESTATS_INGESTION_URL: http://gamestats-go:8080   # alias del puente arcade (Pac-Man y carreras)
      GAMESTATS_ANALYTICS_URL: http://gamestats-scala:8081
      GAMECONSOLE_ARCADE_DB: /data/arcade/events.sqlite3
    volumes:
      - arcade-events:/data/arcade
    ports:
      - "127.0.0.1:${GAMECONSOLE_PORT:-5000}:5000"
    depends_on:
      gamestats-go:
        condition: service_healthy
      gamestats-scala:
        condition: service_healthy
    restart: unless-stopped

  gamestats-go:
    image: ghcr.io/${IMAGE_OWNER:-sebastianvd32}/gameconsole-gamestats-go:${GAMECONSOLE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    environment:
      HTTP_ADDR: ":8080"
      WORKER_COUNT: "4"
      ANALYZER_URL: http://gamestats-scala:8081/api/v1/matches
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      gamestats-scala:
        condition: service_healthy
    restart: unless-stopped

  gamestats-scala:
    image: ghcr.io/${IMAGE_OWNER:-sebastianvd32}/gameconsole-gamestats-scala:${GAMECONSOLE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    volumes:
      - results:/data/results
    restart: unless-stopped

volumes:
  arcade-events:
  results:
